<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHLCG Merger - Create PDF from Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="glass-container">
        <header>
            <h1>AHLCG <span>Merger</span></h1>
            <p>Merge your images into a professional, multi-page PDF document ready for printing.</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-target="upload-section">Upload from Disk</button>
            <button class="tab-btn" data-target="gdrive-section">Google Drive Link</button>
        </div>

        <!-- Section 1: Drag and drop -->
        <section id="upload-section" class="content-section active">
            <div class="drop-zone" id="drop-zone">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p>Drag and drop your <strong>.png</strong> or <strong>.zip</strong> files here</p>
                <span>or click to browse from disk</span>
                <input type="file" id="file-input" multiple accept=".png,.zip" hidden>
            </div>
            
            <div class="file-list" id="file-list"></div>
            
            <div class="progress-container hidden" id="upload-progress-container">
                <div class="progress-bar" id="upload-progress-bar"></div>
                <div class="progress-text" id="upload-progress-text">0%</div>
            </div>
            
            <button class="primary-btn action-btn" id="btn-upload" disabled>
                <span class="btn-text">Generate PDF from files</span>
                <div class="loader hidden"></div>
            </button>
        </section>

        <!-- Section 2: Google Drive link -->
        <section id="gdrive-section" class="content-section">
            <div class="input-group">
                <label for="gdrive-link">Public Google Drive Folder</label>
                <input type="text" id="gdrive-link" placeholder="Paste link (e.g. https://drive.google.com/drive/folders/...)">
                <small class="helper-text">Make sure the GDrive privacy setting is set to "Anyone with the link".</small>
            </div>
            
            <div class="progress-container hidden" id="gdrive-progress-container">
                <div class="progress-bar progress-bar-indeterminate" id="gdrive-progress-bar"></div>
                <div class="progress-text" id="gdrive-progress-text">Connecting to Google Drive...</div>
            </div>
            
            <button class="primary-btn action-btn" id="btn-gdrive" disabled>
                <span class="btn-text">Download and Generate PDF</span>
                <div class="loader hidden"></div>
            </button>
        </section>

        <!-- Notification section -->
        <div id="notification-box" class="notification hidden">
            <span id="notif-message">Processing...</span>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
